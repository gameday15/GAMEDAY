<style>
  :root{
    --navy: #0A1628;
    --panel: #101F38;
    --panel-raised: #16294A;
    --amber: #FFB627;
    --turf: #3FA672;
    --nfl-accent: #FFB627;
    --cfb-accent: #3FA672;
    --mlb-accent: #5AA9E6;
    --yankees: #0C2340;
    --mets: #FF5910;
    --paper: #EDEBE3;
    --muted: #6E7F9C;
    --hairline: #223252;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(255,182,39,0.06), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(90,169,230,0.05), transparent 40%);
  }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }

  /* ---------- Header / flip date ---------- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .masthead h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 28px;
    letter-spacing: 0.06em;
    margin: 0;
    color: var(--paper);
  }

  .masthead h1 span { color: var(--amber); }

  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber);
    display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 6px var(--amber);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .date-nav {
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-bottom: 20px;
  }

  .date-nav button.arrow {
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    width: 42px;
    border-radius: 6px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .date-nav button.arrow:hover { color: var(--amber); border-color: var(--amber); }

  .flip-date {
    flex: 1;
    background: linear-gradient(180deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--hairline);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    position: relative;
    overflow: hidden;
  }
  .flip-date::after {
    content: '';
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 1px;
    background: rgba(0,0,0,0.4);
  }
  .flip-date .dow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .flip-date .dm {
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: var(--amber);
  }

  .date-nav button.today {
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 0 14px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: border-color 0.15s, color 0.15s;
  }
  .date-nav button.today:hover { border-color: var(--amber); color: var(--amber); }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
    gap: 3px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    border: none;
    background: transparent;
    transition: background 0.15s, color 0.15s;
    text-transform: uppercase;
  }
  .tab.active { background: var(--panel-raised); color: var(--paper); }
  .tab .accent-bar {
    display: block;
    height: 2px;
    margin-top: 7px;
    border-radius: 2px;
    background: transparent;
  }
  .tab.active .accent-bar { background: var(--tab-color, var(--amber)); }

  /* ---------- Game list ---------- */
  .league-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 0 0 10px 2px;
  }

  .game-list { display: flex; flex-direction: column; gap: 8px; }

  .game-row {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--tab-color, var(--amber));
    border-radius: 8px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 10px;
    transform-origin: top;
    animation: flipIn 0.4s ease both;
  }

  @keyframes flipIn {
    from { transform: rotateX(-90deg); opacity: 0; }
    to { transform: rotateX(0deg); opacity: 1; }
  }

  .matchup { display: flex; flex-direction: column; gap: 4px; }
  .team-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .team-line img { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
  .team-line .name { color: var(--paper); }
  .team-line .rank {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }
  .team-line .score {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--amber);
  }

  .game-meta {
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .game-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--paper);
    white-space: nowrap;
  }
  .game-time.live { color: var(--amber); }
  .game-time.final { color: var(--muted); }
  .game-net {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* ---------- States ---------- */
  .state-msg {
    text-align: center;
    padding: 48px 16px;
    color: var(--muted);
  }
  .state-msg .big {
    font-family: 'Anton', sans-serif;
    font-size: 18px;
    color: var(--paper);
    letter-spacing: 0.04em;
    margin-bottom: 6px;
    display: block;
  }
  .state-msg .small { font-size: 13px; }

  .skeleton-row {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    height: 62px;
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
  }
  .skeleton-row::after {
    content: '';
    position: absolute;
    top:0; left:-40%; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer {
    to { left: 140%; }
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    font-family: 'JetBrains Mono', monospace;
  }

  @media (prefers-reduced-motion: reduce) {
    .game-row { animation: none; }
    .live-dot { animation: none; }
    .skeleton-row::after { animation: none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <h1>GAME<span>DAY</span></h1>
  </div>

  <div class="date-nav">
    <button class="arrow" id="prevDay" aria-label="Previous day">&#8592;</button>
    <div class="flip-date">
      <span class="dow" id="dowLabel">TODAY</span>
      <span class="dm" id="dateLabel">—</span>
    </div>
    <button class="arrow" id="nextDay" aria-label="Next day">&#8594;</button>
    <button class="today" id="jumpToday">TODAY</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-league="nfl" style="--tab-color:#FFB627;">NFL</button>
    <button class="tab" data-league="cfb" style="--tab-color:#3FA672;">College FB</button>
    <button class="tab" data-league="mlb" style="--tab-color:#5AA9E6;">Yankees &amp; Mets</button>
  </div>

  <p class="league-label" id="leagueLabel">NFL &mdash; Scheduled games</p>
  <div class="game-list" id="gameList"></div>

  <footer>DATA VIA ESPN &middot; TIMES SHOWN IN YOUR LOCAL TIME ZONE</footer>
</div>

<script>
(function(){
  const state = {
    date: new Date(),
    league: 'nfl',
    cache: {} // key: `${league}-${yyyymmdd}` -> events array
  };

  const LEAGUE_CONFIG = {
    nfl: {
      label: 'NFL — Scheduled games',
      color: '#FFB627',
      url: (ymd) => `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${ymd}`
    },
    cfb: {
      label: 'College Football (FBS) — Scheduled games',
      color: '#3FA672',
      url: (ymd) => `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=${ymd}&groups=80&limit=200`
    },
    mlb: {
      label: 'Yankees & Mets — Scheduled games',
      color: '#5AA9E6',
      url: (ymd) => `https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?dates=${ymd}`
    }
  };

  const dowLabel = document.getElementById('dowLabel');
  const dateLabel = document.getElementById('dateLabel');
  const gameList = document.getElementById('gameList');
  const leagueLabel = document.getElementById('leagueLabel');
  const tabs = document.querySelectorAll('.tab');

  function ymd(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}${m}${d}`;
  }

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
  }

  function renderDateLabel() {
    const today = new Date();
    if (isSameDay(state.date, today)) {
      dowLabel.textContent = 'TODAY';
    } else {
      dowLabel.textContent = state.date.toLocaleDateString(undefined, { weekday: 'long' }).toUpperCase();
    }
    dateLabel.textContent = state.date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase();
  }

  function showSkeleton() {
    gameList.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const el = document.createElement('div');
      el.className = 'skeleton-row';
      gameList.appendChild(el);
    }
  }

  function showEmpty(msg, sub) {
    gameList.innerHTML = `<div class="state-msg"><span class="big">${msg}</span><span class="small">${sub}</span></div>`;
  }

  function showError() {
    gameList.innerHTML = `<div class="state-msg"><span class="big">COULDN'T LOAD GAMES</span><span class="small">Check your connection and try again, or come back later.</span></div>`;
  }

  function formatTimeOrStatus(event) {
    const comp = event.competitions[0];
    const statusType = comp.status.type;
    if (statusType.state === 'pre') {
      const d = new Date(event.date);
      return { text: d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }), cls: '' };
    } else if (statusType.state === 'in') {
      return { text: statusType.shortDetail || 'LIVE', cls: 'live' };
    } else {
      return { text: statusType.shortDetail || 'FINAL', cls: 'final' };
    }
  }

  function teamLine(competitor, showScore) {
    const team = competitor.team;
    const logo = team.logo || '';
    const rank = competitor.curatedRank && competitor.curatedRank.current && competitor.curatedRank.current <= 25
      ? `<span class="rank">#${competitor.curatedRank.current}</span>` : '';
    const scoreHtml = showScore && competitor.score !== undefined
      ? `<span class="score">${competitor.score}</span>` : '';
    const name = team.shortDisplayName || team.displayName || team.name || 'TBD';
    return `<div class="team-line">
      ${logo ? `<img src="${logo}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : ''}
      <span class="name">${name}</span>
      ${rank}
      ${scoreHtml}
    </div>`;
  }

  function renderGames(events, league) {
    if (!events.length) {
      showEmpty('NO GAMES TODAY', 'Nothing scheduled for this date — try another day.');
      return;
    }

    // sort by kickoff time
    events.sort((a, b) => new Date(a.date) - new Date(b.date));

    gameList.innerHTML = '';
    events.forEach((event, i) => {
      const comp = event.competitions[0];
      const competitors = comp.competitors || [];
      const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
      const away = competitors.find(c => c.homeAway === 'away') || competitors[1];
      const status = formatTimeOrStatus(event);
      const showScore = comp.status.type.state !== 'pre';
      const broadcasts = comp.broadcasts && comp.broadcasts[0] && comp.broadcasts[0].names
        ? comp.broadcasts[0].names.join('/') : '';

      const row = document.createElement('div');
      row.className = 'game-row';
      row.style.setProperty('--tab-color', LEAGUE_CONFIG[league].color);
      row.style.animationDelay = `${Math.min(i, 8) * 0.04}s`;
      row.innerHTML = `
        <div class="matchup">
          ${away ? teamLine(away, showScore) : ''}
          ${home ? teamLine(home, showScore) : ''}
        </div>
        <div class="game-meta">
          <span class="game-time ${status.cls}">${status.text}</span>
          ${broadcasts ? `<span class="game-net">${broadcasts}</span>` : ''}
        </div>
      `;
      gameList.appendChild(row);
    });
  }

  async function loadGames() {
    const league = state.league;
    const key = `${league}-${ymd(state.date)}`;
    leagueLabel.textContent = LEAGUE_CONFIG[league].label;
    renderDateLabel();

    if (state.cache[key]) {
      renderGames(state.cache[key], league);
      return;
    }

    showSkeleton();

    try {
      const url = LEAGUE_CONFIG[league].url(ymd(state.date));
      const res = await fetch(url);
      if (!res.ok) throw new Error('Bad response');
      const data = await res.json();
      let events = data.events || [];

      if (league === 'mlb') {
        events = events.filter(event => {
          const competitors = event.competitions[0].competitors || [];
          return competitors.some(c => {
            const abbr = (c.team && c.team.abbreviation || '').toUpperCase();
            return abbr === 'NYY' || abbr === 'NYM';
          });
        });
      }

      state.cache[key] = events;
      renderGames(events, league);
    } catch (err) {
      console.error(err);
      showError();
    }
  }

  // ---- events ----
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      state.league = tab.dataset.league;
      loadGames();
    });
  });

  document.getElementById('prevDay').addEventListener('click', () => {
    state.date = new Date(state.date.getTime() - 86400000);
    loadGames();
  });
  document.getElementById('nextDay').addEventListener('click', () => {
    state.date = new Date(state.date.getTime() + 86400000);
    loadGames();
  });
  document.getElementById('jumpToday').addEventListener('click', () => {
    state.date = new Date();
    loadGames();
  });

  loadGames();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>

</body>
</html>
